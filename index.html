<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a68bff">
<title>Bunny English World - Little Learners</title>
<meta name="description" content="Listen, Speak, Read, Write, Play. American English for age 5 with Bunny and Teacher Emma.">
<style>
:root{--bg:#f1eeff;--card:#fff;--ink:#3a2f5b;--soft:#7d72a3;--pink:#ff7fb0;--pink2:#ffd6e6;--mint:#4fcf9f;--mint2:#d5f7ea;--sky:#5db4ff;--sky2:#d9eeff;--sun:#ffc94d;--sun2:#fff0c2;--lilac:#a68bff;--lilac2:#e8e0ff;--bad:#ff6b6b;--r:22px;--sh:0 5px 0 rgba(58,47,91,.18)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Baloo 2","Arial Rounded MT Bold","Trebuchet MS",ui-rounded,system-ui,sans-serif;font-size:19px;line-height:1.35;min-height:100vh;
 background-image:radial-gradient(circle at 12% 8%,#fff 0 90px,transparent 91px),radial-gradient(circle at 92% 20%,#fff 0 60px,transparent 61px),radial-gradient(circle at 80% 90%,#ffe9f3 0 120px,transparent 121px);background-attachment:fixed}
#app{max-width:880px;margin:0 auto;padding:10px 12px calc(30px + env(safe-area-inset-bottom,0px));padding-top:max(10px,env(safe-area-inset-top,0px))}
h1{font-size:1.7rem;margin:.4em 0 .3em;text-align:center}h2{font-size:1.35rem;margin:1em 0 .4em}h3{margin:.8em 0 .3em}
p{margin:.5em 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--lilac);outline-offset:2px}
.vi{color:var(--soft);font-size:.78em;font-weight:600}.center{text-align:center}.hint{color:var(--soft);font-size:.85em;text-align:center}
.tag{font-weight:800;color:var(--lilac)}.tag.small{font-size:.8em;color:var(--soft)}
/* header */
#top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:20;background:rgba(241,238,255,.92);backdrop-filter:blur(6px);padding:6px 2px;border-radius:0 0 16px 16px}
.chips{display:flex;gap:6px;align-items:center}.chip{background:var(--sun2);border:3px solid var(--sun);border-radius:999px;padding:2px 12px;font-weight:800}.chip.big{font-size:.95em}
#emma{display:flex;gap:10px;align-items:center;margin:8px 0}
#emma-face{flex:none;width:78px}#emma-face svg{display:block}
.bubble{position:relative;flex:1;background:var(--card);border:4px solid var(--lilac);border-radius:var(--r);padding:8px 12px;min-height:64px;display:flex;align-items:center;gap:8px;justify-content:space-between;font-weight:700}
.bubble:before{content:"";position:absolute;left:-14px;top:24px;border:9px solid transparent;border-right-color:var(--lilac)}
.bubble-btns{display:flex;gap:4px;flex:none}
#emma-face.talk .mouth{animation:mouth .28s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes mouth{to{transform:scaleY(.35)}}
#emma-face.talk{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
/* buttons */
.btn{background:var(--sky);color:#fff;border:0;border-radius:18px;padding:10px 16px;font-weight:800;box-shadow:var(--sh);text-shadow:0 1px 0 rgba(0,0,0,.15);min-height:44px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(58,47,91,.2)}
.btn.good{background:var(--mint)}.btn.bad{background:var(--bad)}.btn.spk{background:var(--lilac)}
.btn.small{padding:4px 10px;min-height:38px;font-size:.85em;border-radius:14px;box-shadow:0 3px 0 rgba(58,47,91,.18)}
.btn.big{padding:14px 20px;font-size:1.1em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pulse{animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.08)}}
.linkbtn{background:none;border:0;padding:4px 0;text-align:left;color:var(--ink);font-weight:700}
.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:10px 0}.row.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.title{font-weight:800;font-size:1.1rem}
.card{background:var(--card);border-radius:var(--r);padding:12px 16px;margin:12px 0;box-shadow:var(--sh)}
/* tiles */
.grid{display:grid;gap:12px;margin:12px 0}
.grid.tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.words{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.grid.letters{grid-template-columns:repeat(auto-fill,minmax(58px,1fr))}
.tile{background:var(--card);border:4px solid var(--lilac2);border-radius:var(--r);padding:12px 8px;text-align:center;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;min-height:130px}
.tile:active{transform:translateY(3px)}
.tile .te{font-size:2.6rem;line-height:1.1}.tile .tn{font-weight:800}.tile .tl{font-size:.8em;color:var(--soft)}.tile .tp{font-size:.8em;font-weight:800;color:var(--mint)}
.home-tiles .c1{background:var(--pink2);border-color:var(--pink)}.home-tiles .c2{background:var(--mint2);border-color:var(--mint)}.home-tiles .c3{background:var(--sky2);border-color:var(--sky)}.home-tiles .c4{background:var(--sun2);border-color:var(--sun)}.home-tiles .c5{background:var(--lilac2);border-color:var(--lilac)}.home-tiles .c6{background:#ffe6d5;border-color:#ff9a62}
.wcard{background:var(--card);border:3px solid var(--sky2);border-radius:18px;padding:8px;text-align:center;box-shadow:0 4px 0 rgba(58,47,91,.12)}
.wcard .te{font-size:2.4rem}.wcard .tn{font-weight:800}
.hl{color:var(--pink);text-decoration:underline}
/* hero */
.hero{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:28px;padding:10px 14px;box-shadow:var(--sh);margin:8px 0}
.hero-chars{display:flex;align-items:flex-end;flex:none}.hero-chars span{display:block}.hero h1{text-align:left;font-size:1.5rem;margin:0}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cta{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px}.cta small{font-weight:600;opacity:.95;font-size:.7em}.cta-e{font-size:2rem}.cta2{background:var(--pink);display:flex;flex-direction:column;align-items:center;gap:2px}.cta2 small{font-size:.7em;font-weight:600}
.welcome{text-align:center;background:var(--card);border-radius:28px;padding:18px;box-shadow:var(--sh)}
input.bigtext{font:inherit;font-size:1.5rem;font-weight:800;text-align:center;border:4px solid var(--lilac);border-radius:18px;padding:10px;width:min(320px,90%);color:var(--ink);background:#fff}input.bigtext.sm{font-size:1.1rem;width:min(260px,100%)}
/* activity basics */
.count{text-align:center;color:var(--soft);font-weight:800;margin:4px 0}
.prompt{text-align:center;font-weight:800;font-size:1.15rem;margin:8px 0}
.qhead{display:flex;gap:8px;justify-content:center;align-items:center;margin:6px 0}
.stem{margin:6px 0;text-align:center}
.opts{display:grid;gap:12px;margin:12px 0}.opts.cols1{grid-template-columns:1fr}.opts.cols2{grid-template-columns:1fr 1fr}.opts.cols3{grid-template-columns:repeat(3,1fr)}.opts.cols4{grid-template-columns:repeat(4,1fr)}
.opt{background:var(--card);border:4px solid var(--sky2);border-radius:var(--r);padding:10px 6px;min-height:84px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--mint2);border-color:var(--mint);animation:pop .4s}.opt.wrong{background:#ffe3e3;border-color:var(--bad);animation:shake .35s}.opt.sel{border-color:var(--lilac);background:var(--lilac2)}
@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pic{font-size:3rem;line-height:1.1}.pic.small{font-size:2.4rem}.big-pic{font-size:6rem;line-height:1.1;text-align:center}.big-pic.small{font-size:3.4rem}.big-pic.blur{filter:blur(8px);opacity:.8}
.word{font-size:1.4rem}.word.left{text-align:left;font-size:1.1rem}.letter{font-size:2.6rem}
.bigword{font-size:2.4rem;font-weight:800;text-align:center;letter-spacing:.04em}.bigword.small{font-size:1.5rem}.bigword.spaced{letter-spacing:.3em}
.olabel{font-size:.9rem}
.done{text-align:center;background:var(--card);border-radius:28px;padding:20px;margin:10px 0;box-shadow:var(--sh)}
.big-emoji{font-size:4.5rem}.stars-earned{font-size:2.2rem;min-height:2.6rem}
.flashcard{background:var(--card);border-radius:28px;padding:16px;text-align:center;box-shadow:var(--sh);border:4px solid var(--sky2)}.flashcard .sent{font-weight:700;color:var(--soft);margin-top:6px}
.activity{margin-top:6px}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}.mcol{display:flex;flex-direction:column;gap:10px}
/* memory */
.mem{display:grid;gap:10px;margin:10px 0}.mem.cols3{grid-template-columns:repeat(3,1fr)}.mem.cols4{grid-template-columns:repeat(4,1fr)}
.memcard{background:var(--lilac);color:#fff;border:0;border-radius:18px;min-height:92px;font-size:2.2rem;font-weight:800;box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;padding:4px;word-break:break-word}
.memcard.open{background:#fff;color:var(--ink);border:4px solid var(--lilac);font-size:1.5rem}.memcard.gone{background:var(--mint2);color:var(--ink);border:4px solid var(--mint);opacity:.75}
/* phonics */
.lcard{background:var(--card);border:4px solid var(--pink);border-radius:28px;padding:10px 24px;text-align:center;display:inline-block;box-shadow:var(--sh)}.meet{text-align:center}
.lbig{font-size:5rem;font-weight:800;color:var(--pink)}.ipa{font-size:1.5rem;color:var(--soft);font-weight:700}
.tiles-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tile-sound{min-width:64px;min-height:72px;font-size:2.2rem;font-weight:800;border-radius:18px;border:4px solid var(--sky);background:var(--sky2);box-shadow:var(--sh);padding:0 12px}
.tile-sound.vowel{border-color:var(--pink);background:var(--pink2)}.tile-sound.silent{opacity:.5;border-style:dashed}.tile-sound.lit{background:var(--sun);transform:scale(1.1)}.tile-sound.word{font-size:1.3rem;min-width:50px;min-height:54px}.tile-sound.wrong{background:#ffe3e3;animation:shake .35s}
.slots{display:flex;gap:8px;justify-content:center;margin:10px 0}.slot{min-width:48px;height:56px;border-bottom:5px solid var(--lilac);font-size:2.2rem;font-weight:800;text-align:center;display:inline-block}.slot.wide{min-width:64px;font-size:1.3rem;height:46px;border-radius:10px;border:3px dashed var(--lilac2);border-bottom:5px solid var(--lilac)}.slot.filled{color:var(--pink);border-color:var(--mint)}
.build-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.order-row{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap}.order-row .slot{font-size:2rem;min-width:56px;border:3px dashed var(--lilac);border-radius:14px;height:60px}.order-row .slot.filled{border-style:solid;border-color:var(--mint)}
/* reading */
.scene{font-size:4.5rem;text-align:center;background:var(--sun2);border-radius:28px;padding:12px;margin:8px 0;border:4px solid var(--sun)}
.sentence{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:8px 0;font-size:1.5rem}
.tok{background:#fff;border:3px solid transparent;border-radius:12px;padding:2px 8px;font-weight:800;font-size:1.35rem}.tok.on{background:var(--sun);border-color:var(--sun)}
.songbox{background:#fff;border-radius:24px;padding:10px 16px;box-shadow:var(--sh)}.songline{margin:6px 0;padding:6px 10px;border-radius:14px;font-weight:800;font-size:1.2rem;cursor:pointer}.songline.on{background:var(--sun);}
/* speaking */
.dots{display:flex;gap:6px;justify-content:center;margin:6px 0}.dot{width:14px;height:14px;border-radius:50%;background:var(--lilac2)}.dot.done{background:var(--mint)}.dot.cur{background:var(--sun);transform:scale(1.3)}
.say-box{display:flex;gap:10px;align-items:center;background:#fff;border-radius:22px;padding:8px 12px;margin:8px 0;box-shadow:var(--sh);border:4px solid var(--lilac2)}.say-box.emma{border-color:var(--lilac)}.say-box.you{border-color:var(--pink)}.say-box .who{flex:none}.say-box .line{font-weight:800;font-size:1.2rem}
.micwrap{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.mic-btn{width:96px;height:96px;border-radius:50%;border:0;background:var(--pink);font-size:2.8rem;box-shadow:0 6px 0 #d8558a;color:#fff}.mic-btn.on{background:var(--mint);animation:pulse .6s infinite alternate;box-shadow:0 6px 0 #2f9e63}.mic-btn:disabled{opacity:.4}
.mic-status{font-weight:800;color:var(--soft);text-align:center;min-height:1.6em}.mic-status.s-none,.mic-status.s-error,.mic-status.s-denied{color:#d6455d}
.heard{text-align:center;font-weight:700;color:var(--soft);min-height:1.2em}.hintbox{text-align:center;font-weight:800;color:var(--lilac);min-height:1.2em}
.choices{display:flex;flex-direction:column;gap:8px;margin:8px 0}.choice{background:var(--sky);text-align:left}
.tools{margin-top:14px}
/* writing */
.tracewrap{position:relative;width:min(300px,86vw);aspect-ratio:76/126;margin:8px auto;background:#fff;border-radius:24px;border:4px dashed var(--lilac);overflow:hidden;touch-action:none}
.traceguide,.tracecanvas{position:absolute;inset:0;width:100%;height:100%}
.wline{stroke:#cfd6f5;stroke-width:.8}.wline.dashed{stroke-dasharray:3 3}.gpath{fill:none;stroke:#d7cff7;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.apath{fill:none;stroke:var(--pink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.sdot{fill:var(--mint);stroke:#fff;stroke-width:1.5}.snum{font-size:8px;font-weight:800;fill:#fff}
.meter{width:min(300px,86vw);height:14px;background:var(--lilac2);border-radius:99px;margin:6px auto;overflow:hidden}.bar{height:100%}.meter .bar{background:var(--mint);width:0;transition:width .3s;height:14px}
.letterbtn{font-size:1.5rem;padding:6px}.letterbtn.done{background:var(--mint)}
/* games */
.hunt{display:grid;gap:6px;max-width:360px;margin:10px auto}.hcell{aspect-ratio:1;border:3px solid var(--sky2);background:#fff;border-radius:12px;font-size:1.5rem;font-weight:800;text-transform:uppercase;box-shadow:0 3px 0 rgba(58,47,91,.12);padding:0}.hcell.sel{background:var(--sun);border-color:var(--sun)}.hcell.found{background:var(--mint);color:#fff;border-color:var(--mint)}
.tag{display:inline-block}.row .tag{background:#fff;border-radius:99px;padding:4px 12px;border:3px solid var(--sky2);color:var(--ink)}.row .tag.ok{background:var(--mint2);border-color:var(--mint);text-decoration:line-through}
.cshape{display:inline-block;border-radius:14px}.cshape.big{width:68px;height:68px;font-size:68px;line-height:68px}.cshape.small{width:38px;height:38px;font-size:38px;line-height:38px}.cshape.sh-circle{border-radius:50%}.cshape.sh-square{border-radius:10px}.cshape.sh-star,.cshape.sh-triangle{border-radius:0}
/* progress & parent */
.lessonmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:12px 0}
.part{background:#fff;border:4px solid var(--lilac2);border-radius:var(--r);padding:12px 6px;display:flex;flex-direction:column;gap:2px;align-items:center;box-shadow:var(--sh);font-weight:800}.part.done{background:var(--mint2);border-color:var(--mint)}.part.next{background:var(--sun2);border-color:var(--sun);animation:pulse .9s infinite alternate}.part .pn{font-size:2rem}
.wchip{background:#fff;border:3px solid var(--sky2);border-radius:99px;padding:4px 12px;font-weight:800}
.sentlist{list-style:none;padding:0;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:10px 0}.stat{background:#fff;border-radius:20px;padding:8px;text-align:center;box-shadow:var(--sh)}.stat .te{font-size:1.6rem}.stat .sv{font-size:1.8rem;font-weight:800}.stat .sl{font-size:.75em;color:var(--soft);font-weight:700}
.skills{display:grid;gap:10px}.skill{background:#fff;border-radius:16px;padding:8px 12px;box-shadow:var(--sh);font-weight:800}.skill .bar{height:14px;background:var(--lilac2);border-radius:99px;overflow:hidden;margin:4px 0}.skill .bar div{height:100%;background:var(--mint)}
.tree{width:min(420px,100%);display:block;margin:0 auto}
.week{display:flex;gap:6px;align-items:flex-end;justify-content:space-between;height:140px;background:#fff;border-radius:18px;padding:10px;box-shadow:var(--sh)}.day{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}.day .col{width:70%;flex:1;display:flex;align-items:flex-end}.day .col div{width:100%;background:var(--sky);border-radius:8px 8px 0 0;min-height:3px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.badge{background:#fff;border-radius:18px;padding:8px;text-align:center;font-size:.8em;font-weight:800;opacity:.55}.badge.on{opacity:1;border:3px solid var(--sun)}.badge .te{font-size:2rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.tabbtn{background:#fff;border:3px solid var(--lilac2);border-radius:99px;padding:6px 14px;font-weight:800}.tabbtn.on{background:var(--lilac);color:#fff;border-color:var(--lilac)}
.roadmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}.rm{text-align:left;background:#fff;border:3px solid var(--lilac2);border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:2px}.rm.done{background:var(--mint2);border-color:var(--mint)}.rm small{color:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font-size:.9em}.tbl td,.tbl th{border-bottom:1px solid var(--lilac2);padding:6px;text-align:left}
select{font:inherit;padding:6px;border-radius:12px;border:3px solid var(--lilac2);max-width:100%}
.gate{text-align:center;background:#fff;border-radius:24px;padding:16px;box-shadow:var(--sh)}
.netbar{position:fixed;left:0;right:0;bottom:0;background:var(--sun);text-align:center;padding:6px;font-weight:800;z-index:40}
.netbar[hidden]{display:none}
/* overlays */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;opacity:0;transition:.3s;max-width:90vw;font-weight:700;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-back{position:fixed;inset:0;background:rgba(58,47,91,.5);display:grid;place-items:center;z-index:50;padding:12px}.modal{background:#fff;border-radius:24px;padding:18px;max-width:520px;max-height:90vh;overflow:auto}.modal-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.spark{position:absolute;pointer-events:none;z-index:70;font-size:1.6rem;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
@media (max-width:560px){body{font-size:17px}#emma-face{width:60px}#emma-face svg{width:60px;height:auto}.hero{flex-direction:column;text-align:center}.hero h1{text-align:center}.big-pic{font-size:5rem}.opts.cols4{grid-template-columns:1fr 1fr}.ctas{grid-template-columns:1fr}.tile{min-height:112px}.tile .te{font-size:2.2rem}.lbig{font-size:4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v3 additions */
.statuspill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;margin-top:6px}
.statuspill.ok{background:#d6f5df;color:#17663b}.statuspill.warn{background:#fff0c2;color:#7a5200}.statuspill.soon{background:#e8e4ff;color:#4a3aa0}
.chatlog{min-height:180px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:8px;background:#fafaff;border-radius:16px;margin-bottom:10px}
.msg{max-width:85%;padding:10px 14px;border-radius:18px;font-size:1.1rem;line-height:1.35}
.msg.ai{align-self:flex-start;background:#fff;border:2px solid #d9d2ff}.msg.me{align-self:flex-end;background:#d6f5df}.msg.err{background:#ffe3e3;border-color:#f5b5b5}.msg.wait{opacity:.6}
.fix{align-self:flex-start;background:#fff8dc;border:2px dashed #f0c040;border-radius:14px;padding:8px 12px;margin:2px 0}.fixbig{font-size:1.2rem;font-weight:700}

B.touchDay=function(){const t=B.dayKey(),st=B.S.streak;if(st.last!==t){st.count=(st.last===B.addDays(t,-1))?st.count+1:1;st.last=t;st.best=Math.max(st.best,st.count);}};
B.skill=function(name,ok){const s=B.S.skills[name];s.n++;if(ok)s.ok++;B.dayRec().acts++;B.touchDay();B.save();};
const GAP=[1,2,4,7,14,30];
B.word=function(w,ok){w=w.toLowerCase();const r=B.S.words[w]||(B.S.words[w]={seen:0,ok:0,bad:0,box:0,due:B.dayKey()});r.seen++;
  if(ok===true){r.ok++;r.box=Math.min(5,r.box+1);r.due=B.addDays(B.dayKey(),GAP[r.box]);}else if(ok===false){r.bad++;r.box=Math.max(0,r.box-1);r.due=B.dayKey();}
  B.save();};
B.dueWords=function(limit){const t=B.dayKey();return Object.keys(B.S.words).filter(w=>B.S.words[w].seen>0&&B.S.words[w].due<=t&&B.WORD[w]).sort((a,b)=>B.S.words[a].box-B.S.words[b].box).slice(0,limit||10).map(w=>B.WORD[w]);};
B.counts=function(){const ws=B.S.words;let seen=0,mastered=0,need=0;const t=B.dayKey();for(const w in ws){if(ws[w].seen>0){seen++;if(ws[w].box>=3)mastered++;if(ws[w].due<=t&&ws[w].box<3)need++;}}return{seen,mastered,need};};
/* Stars are earned only by finishing real activities. key + day cap prevents star farming. */
B.reward=function(key,ok,total,skill){
  const acc=total?ok/total:0;let n=0;
  if(ok>0)n=acc>=0.8?3:acc>=0.5?2:1;
  const ek=key+"|"+B.dayKey();B.S.earn[ek]=(B.S.earn[ek]||0)+1;
  if(B.S.earn[ek]>2)n=0;
  if(n){B.S.stars+=n;B.dayRec().stars+=n;B.touchDay();B.cheer();}
  if(skill)for(let i=0;i<total;i++)B.skill(skill,i<ok);
  B.checkBadges();B.save();B.updateTop();return n;
};

 ["streak3","3-day streak","Học 3 ngày liên tiếp","🔥",s=>s.streak.best>=3],["streak7","7-day streak","Học 7 ngày liên tiếp","🔥",s=>s.streak.best>=7],

B.importData=function(text){let o;try{o=JSON.parse(text);}catch(e){return false;}if(!o||o.v!==2||!o.settings||!o.skills||!o.profile)return false;B.S=o;B.load.merged=true;const f=fresh();for(const k in f)if(B.S[k]===undefined)B.S[k]=f[k];for(const k in f.settings)if(B.S.settings[k]===undefined)B.S.settings[k]=f.settings[k];B.save(true);return true;};

/* active-time tracker (counts only while the page is visible and the child interacted recently) */

/* ---------- sound effects (tiny, optional) ---------- */
let AC=null;
B.beep=function(f,d,t){if(!B.S.settings.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.value=f;g.gain.value=0.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}};
B.cheer=()=>[660,880,1100].forEach((f,i)=>setTimeout(()=>B.beep(f,0.18),i*110));
B.ding=()=>B.beep(784,0.2);
B.oops=()=>B.beep(240,0.25,"triangle");
B.tick=()=>B.beep(520,0.08,"square");

/* ---------- audio: recorded clips first, then device TTS (en-US female preferred) ---------- */
const A=B.audio={voices:[],voice:null,pack:{},token:0,mode:"tts",warned:false};
A.slug=t=>B.norm(t).replace(/ /g,"-").slice(0,80);
A.loadPack=function(){fetch("audio/manifest.json").then(r=>r.ok?r.json():null).then(j=>{if(j&&j.clips)A.pack=j.clips;}).catch(()=>{});};
A.score=function(x){
  const n=x.name,l=x.lang.replace("_","-");
  let sc=0;
  if(/^en-US$/i.test(l))sc+=40;else if(/^en/i.test(l))sc+=5;
  if(/natural|neural|online/i.test(n))sc+=30;            /* Microsoft Edge "Online (Natural)" voices are the best free ones */
  if(/premium|enhanced|siri/i.test(n))sc+=22;             /* Apple enhanced voices */
  if(/aria|jenny|ava|emma|michelle|ana\b|allison|samantha|nicky|joanna|salli|kendra|ivy|kimberly|zira|susan|serena/i.test(n))sc+=14;
  if(/google us english|google.*en-us/i.test(n))sc+=16;
  if(/\b(guy|davis|tony|jason|eric|roger|steffan|christopher|brandon|andrew|brian|ryan|david|mark|alex|fred|tom|daniel|male)\b/i.test(n))sc-=30;
  if(/espeak|compact|novelty|bad news|bells|boing|cellos|good news|jester|organ|whisper|zarvox|trinoids|albert|bubbles|superstar|wobble/i.test(n))sc-=60;
  if(!x.localService)sc+=2;
  return sc;
};
A.pickVoices=function(){
  if(!("speechSynthesis" in window))return;
  let all=[];try{all=speechSynthesis.getVoices();}catch(e){}
  let v=all.filter(x=>/^en[-_]/i.test(x.lang)).slice();
  v.sort((a,b)=>A.score(b)-A.score(a));A.voices=v;
  A.voice=v.find(x=>x.name===B.S.settings.voice)||v[0]||null;
  A.natural=!!(A.voice&&/natural|neural|online|premium|enhanced|google/i.test(A.voice.name));
  A.isUS=!!(A.voice&&/^en[-_]US/i.test(A.voice.lang));
};
A.init=function(){A.loadPack();A.pickVoices();if("speechSynthesis" in window){try{speechSynthesis.onvoiceschanged=A.pickVoices;}catch(e){}setTimeout(A.pickVoices,400);setTimeout(A.pickVoices,1500);}};
A.available=()=>("speechSynthesis" in window)&&A.voices.length>0;
A.stop=function(){A.token++;try{speechSynthesis.cancel();}catch(e){}if(A.cur){try{A.cur.pause();}catch(e){}A.cur=null;}B.talking(false);};
A.clip=function(src){return new Promise(res=>{const a=new Audio(src);A.cur=a;a.onended=()=>res(true);a.onerror=()=>res(false);a.play().catch(()=>res(false));});};
/* speak(text, {slow:boolean, key:string}) -> Promise that resolves when finished (or cancelled) */
A.speak=function(text,o){
  o=o||{};text=B.fill(text);const my=++A.token;
  try{speechSynthesis.cancel();}catch(e){}if(A.cur){try{A.cur.pause();}catch(e){}}
  const rate=Math.max(0.5,Math.min(1.1,(B.S.settings.rate||0.85)*(o.slow?0.7:1)));
  const clipFile=A.pack[o.key||A.slug(text)];
  const finish=()=>{if(my===A.token)B.talking(false);};
  B.talking(true);
  if(clipFile){return A.clip("audio/"+clipFile).then(ok=>{finish();if(!ok&&my===A.token)return A.tts(text,rate,my,o);});}
  return A.tts(text,rate,my,o).then(finish);
};
A.tts=function(text,rate,my,o){o=o||{};
  let pv=A.voice;if(o.lang&&!/^en-US/i.test(o.lang)){let all=[];try{all=speechSynthesis.getVoices();}catch(e){}const c=all.filter(x=>x.lang.replace("_","-").toLowerCase()===o.lang.toLowerCase());if(c.length)pv=c.find(x=>/natural|neural|female|google|aria|libby|sonia|karen|catherine|samantha|serena|kate/i.test(x.name))||c[0];}
  return new Promise(res=>{
    if(!("speechSynthesis" in window)){A.noVoice();return setTimeout(res,Math.min(2500,400+text.length*45));}
    const parts=text.match(/[^.!?]+[.!?]*/g)||[text];let i=0;
    const next=()=>{if(my!==A.token||i>=parts.length)return res();
      const u=new SpeechSynthesisUtterance(parts[i++].trim());u.lang="en-US";if(pv)u.voice=pv;u.rate=rate;u.pitch=o.pitch||1.05;u.volume=1;
      let done=false;const fin=()=>{if(done)return;done=true;clearTimeout(guard);next();};
      const guard=setTimeout(fin,Math.max(1800,u.text.length*140/rate+1200));
      u.onend=fin;u.onerror=fin;
      try{speechSynthesis.speak(u);}catch(e){fin();}};
    if(!A.voices.length)A.noVoice();
    next();
  });
};
A.noVoice=function(){if(A.warned)return;A.warned=true;B.toast("No English voice found on this device. Words are shown on screen. Ask a parent to open Parent Corner for help.");};
A.sound=function(item){ /* letter/pattern sound: recorded clip if present, otherwise letter name + example word (never "buh/cuh") */
  const id="ph-"+item.g.replace(/[^a-z]/g,"");const c=A.pack[id];
  if(c){B.talking(true);return A.clip("audio/"+c).then(()=>B.talking(false));}
  const w=item.words[0].w;
  return A.speak(item.g.length===1?item.g.toUpperCase()+". "+w+".":w+".",{slow:true});
};
B.say=function(text,o){o=o||{};const t=B.fill(text);B.setBubble(t);if(o.silent)return Promise.resolve();return A.speak(t,o);};
B.sayPlain=(t,o)=>A.speak(t,o);

/* ---------- speech recognition (Web Speech API; only on a tap, never in background) ---------- */
const M=B.mic={};
M.Ctor=()=>window.SpeechRecognition||window.webkitSpeechRecognition;
M.supported=()=>!!M.Ctor();
M.mode=()=>B.S.settings.mic;  // "ask" | "on" | "off"
M.usable=()=>M.supported()&&B.S.settings.mic!=="off";
M.consent=function(){
  return new Promise(res=>{
    if(B.S.settings.mic==="on")return res(true);if(B.S.settings.mic==="off")return res(false);
    B.modal([h("h2",null,"🎤 Use the microphone?"),
      h("p",null,"Grown-up note: when the child taps the microphone button, the browser listens for a few seconds and turns speech into text. Chrome and Safari usually send the sound to their own online service (Google or Apple) to do this. Bunny English World itself never records or saves sound."),
      h("p",{class:"vi"},"Dành cho phụ huynh: khi bé bấm nút micro, trình duyệt sẽ nghe vài giây để chuyển giọng nói thành chữ. Chrome/Safari thường gửi âm thanh tới dịch vụ trực tuyến của Google/Apple. Ứng dụng này không ghi âm và không lưu âm thanh."),
      h("p",null,"The app only checks the words it hears. It does not score pronunciation.")],
      [["Use microphone",()=>{B.S.settings.mic="on";B.save();res(true);},"btn good"],["No microphone",()=>{B.S.settings.mic="off";B.save();res(false);},"btn"]]);
  });
};
/* listen(onState) -> Promise<{status:"heard"|"none"|"denied"|"error"|"unsupported"|"off", text, alts:[]}> */
M.listen=async function(onState){
  onState=onState||function(){};
  if(!M.supported()){onState("unsupported");return{status:"unsupported",text:"",alts:[]};}
  if(!(await M.consent())){onState("off");return{status:"off",text:"",alts:[]};}
  A.stop();
  return new Promise(res=>{
    let r;try{r=new(M.Ctor())();}catch(e){onState("unsupported");return res({status:"unsupported",text:"",alts:[]});}
    r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
    let got=null,err=null,fin=false;
    const end=()=>{if(fin)return;fin=true;clearTimeout(tm);
      if(got){onState("heard");res({status:"heard",text:got[0],alts:got});}
      else if(err==="not-allowed"||err==="service-not-allowed"){onState("denied");res({status:"denied",text:"",alts:[]});}
      else if(err==="network"||err==="audio-capture"){onState("error");res({status:"error",text:"",alts:[],error:err});}
      else{onState("none");res({status:"none",text:"",alts:[]});}};
    r.onstart=()=>onState("listening");
    r.onspeechstart=()=>onState("speech");
    r.onresult=e=>{const a=[];for(let i=0;i<e.results[0].length;i++)a.push(e.results[0][i].transcript);got=a;onState("processing");};
    r.onerror=e=>{err=e.error;};
    r.onend=end;
    const tm=setTimeout(()=>{try{r.stop();}catch(e){}setTimeout(end,1200);},9000);
    M.cur=r;
    try{r.start();}catch(e){err="error";end();}
  });
};
M.stop=()=>{try{M.cur&&M.cur.abort();}catch(e){}};
/* Matching = understanding the words, NOT pronunciation scoring */
const STOPW=new Set("a an the is are am i you it its to of in on at my me we he she and or this that".split(" "));
function content(s){return B.norm(s).split(" ").filter(x=>x&&!STOPW.has(x));}
B.match=function(texts,ok,models){
  const joined=" "+B.norm(texts.join(" . "))+" ";let hit=false;
  (ok||[]).forEach(w=>{w=B.norm(B.fill(w));if(w&&joined.indexOf(" "+w+" ")>=0)hit=true;});
  let best=0;
  (models||[]).forEach(m=>{const mt=content(B.fill(m));if(!mt.length)return;texts.forEach(t=>{const tt=new Set(content(t));const n=mt.filter(x=>tt.has(x)).length;best=Math.max(best,n/mt.length);});});
  return{ok:hit||best>=0.6,exact:best>=0.85,score:best};
};

/* ---------- quiz engine ----------
 opts:{title, skill, key, rounds:[{say, stem(node|html), options:[{node|html,label,correct}], word, hint, cols}], onDone(res), backTo}
 - never timed, always allows replay, wrong answers get a gentle retry */
B.quiz=function(root,opts){
  const rounds=opts.rounds;let i=0,first=0,tries=0;B.clear(root);
  const praise=["Great job!","Excellent!","Super!","Wonderful!","You got it!","Awesome!"];
  function show(){
    B.clear(root);tries=0;const r=rounds[i];
    const stem=h("div",{class:"stem"});if(r.stem){if(r.stem.nodeType)stem.appendChild(r.stem);else stem.innerHTML=r.stem;}
    const grid=h("div",{class:"opts cols"+(r.cols||Math.min(3,r.options.length))});
    r.options.forEach(o=>{
      const b=h("button",{class:"opt","aria-label":o.label||""},o.node||h("span",{html:o.html||""}),o.label&&!o.noLabel?h("span",{class:"olabel"},o.label):null);
      b.onclick=()=>{
        if(b.disabled)return;
        if(o.correct){grid.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add("right");B.ding();B.burst(b);
          if(tries===0)first++;if(r.word)B.word(r.word,tries===0);
          B.say(B.pick(praise)+(r.after?" "+r.after:(r.word?" "+r.word+".":"")),{}).then(()=>{i++;i<rounds.length?show():done();});}
        else{tries++;b.classList.add("wrong");b.disabled=true;B.oops();if(r.word&&tries===1)B.word(r.word,false);
          B.say(tries>=2&&r.hint?"Let's try again. "+r.hint:"Good try! Try again.");}
      };
      grid.appendChild(b);
